<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Matches --c-cream in styles/tokens.css. The inline script below swaps
         it for the dark value; change the palette, change both. -->
    <meta name="theme-color" content="#FFFFFF" />

    <title>Mahmoud Elzaqla — E-commerce Growth Specialist</title>
    <meta
      name="description"
      content="Mahmoud Elzaqla — E-commerce Growth Specialist. I build Shopify stores, run Meta and TikTok ads, and read the product, the market, the customer, the operation and the numbers before I read the ad."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      THE SHARING CARD FOR THE WHOLE SITE.

      WhatsApp and LinkedIn fetch this file and never run the app, so every
      url on the site previews with exactly these tags. src/lib/head.ts keeps
      the per-page title and description correct for the browser tab and for
      crawlers that do render, but it cannot reach those scrapers — a
      per-page card needs the routes prerendered at build time.

      og:image is absolute because LinkedIn requires it, and png because
      WhatsApp does not reliably render webp in a card. The origin is set
      here and once more in src/lib/head.ts; change both together.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahmoud Elzaqla" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta property="og:url" content="https://mahmoudelzaqla.site/" />
    <meta property="og:title" content="Mahmoud Elzaqla — E-commerce Growth Specialist" />
    <meta
      property="og:description"
      content="I build Shopify stores, run Meta and TikTok ads, and read the product, the market, the customer, the operation and the numbers before I read the ad."
    />
    <meta property="og:image" content="https://mahmoudelzaqla.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mahmoud Elzaqla — E-commerce Growth Specialist" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="محمود عاطف — E-commerce Growth Specialist" />
    <meta
      name="twitter:description"
      content="I build Shopify stores, run Meta and TikTok ads, and read the product, the market, the customer, the operation and the numbers before I read the ad."
    />
    <meta name="twitter:image" content="https://mahmoudelzaqla.site/og.png" />

    <!--
      Theme before first paint. Without this the page renders light and then
      snaps to dark on hydration, which is worse than no dark mode at all.
      Keep the key and the attribute in step with src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;

          // THEME: dark unless this visitor has chosen light. Not the
          // operating system's preference — the site should look the same to
          // everyone who has not chosen, and dark is that look.
          var saved = localStorage.getItem('theme');
          var dark = saved !== 'light';
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0F0F0F');
          }

          // LANGUAGE: the document ships lang="en" dir="ltr", so an Arabic url
          // would paint left-to-right for one frame and then flip. The path
          // already says which language this is — "/ar..." is Arabic, anything
          // else is English. Keep this in step with src/i18n/config.ts.
          var ar = location.pathname.split('/').filter(Boolean)[0] === 'ar';
          root.lang = ar ? 'ar' : 'en';
          root.dir = ar ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Microsoft Clarity — session recordings and heatmaps.
      Project "mahmoudelzaqla.site", id ym7hoi1r3c. Added 2026-09-22.

      PRODUCTION ONLY. The hostname test is the whole point of writing the
      tag out by hand instead of pasting Clarity's: without it every
      `npm run dev` session and every Vercel preview build lands in the
      recordings, and the heatmaps stop being real visitors. It matches the
      live domain and its subdomains, nothing else.

      The tag itself is Clarity's own loader, unchanged: it injects an async
      script, so it never blocks first paint. Clarity masks text content by
      default and this site has no inputs to leak, so no extra masking rules
      are needed here — masking is configured in the Clarity dashboard.
    -->
    <script>
      (function (c, l, a, r, i, t, y) {
        if (!/(^|\.)mahmoudelzaqla\.site$/.test(l.location.hostname)) return;
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'ym7hoi1r3c');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Brand identity v3: Archivo (Latin) + IBM Plex Sans Arabic (Arabic), plus
      Caveat for the hand-written marginalia.

      THE WEIGHTS ARE THE ONES THE CSS ACTUALLY ASKS FOR, nothing more:
      Archivo 400-900 (the display face runs at 800, one element at 900),
      Caveat 500 and 600 (`.hand`, both scripts), IBM Plex Sans Arabic
      400-700. Plex 300 and Caveat 700 came out on 2026-09-15 — no rule used
      them, and every extra weight is another file to fetch on a phone.

      Loaded without blocking render: fetched as `print`, then flipped to
      `all` when it arrives. Safe because every face is `display=swap`, so
      the fallback shows immediately either way — this only stops the round
      trip to Google from holding up first paint.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Caveat:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Caveat:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Caveat:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- The photograph is the first thing in the page now and the LCP
         candidate, so it is fetched before the bundle asks for it. -->
    <!--
      THE BREAKPOINT HERE HAS TO MATCH THE ONE THE PAGE SWITCHES AT.
      It said 1023/1024 while the hero switches files at 768, so between
      those widths a visitor preloaded one file and was then shown the
      other: a wasted download AND an LCP image that was never preloaded.

      AVIF, with `type`, so a browser that cannot decode it skips the
      preload and simply takes the WebP from the <picture> instead.
    -->
    <link rel="preload" as="image" href="/work/personal/hero-mobile.avif" type="image/avif" media="(max-width: 767px)" />
    <link rel="preload" as="image" href="/work/personal/hero-desktop.avif" type="image/avif" media="(min-width: 768px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
